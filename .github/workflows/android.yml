name: Android

on:
  pull_request:
    paths: [android/**, protocol/**, .github/workflows/android.yml]
  push:
    branches: [main]
    paths: [android/**, protocol/**, .github/workflows/android.yml]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Format check
        run: ./gradlew --no-daemon spotlessCheck
      - name: Unit tests, lint, debug build, and release R8 verification
        run: >-
          ./gradlew --no-daemon --stacktrace
          test testDebugUnitTest lintDebug assembleDebug
          :app:lintRelease :app:assembleRelease
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-reports
          path: '**/build/reports/**'
          if-no-files-found: ignore
          retention-days: 7

  # TODO: device-tests job (emulator: Room migrations, Keystore, app journeys) once those tests exist.

  screenshots:
    # Keep rendering on macOS to match the reviewed reference font environment.
    runs-on: macos-15
    timeout-minutes: 30
    env:
      TZ: UTC
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Validate reviewed screenshots
        run: ./gradlew --no-daemon validateDebugScreenshotTest
      - name: Upload screenshot comparisons
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshot-reports
          path: |
            android/**/build/reports/screenshotTest/**
            android/**/build/outputs/screenshotTest*/**
          if-no-files-found: ignore
          retention-days: 7
